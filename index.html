<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品ポップメーカー</title>
<meta name="description" content="商品名・説明文・価格を入力するだけで、印刷できる商品ポップ（POP）を作成できるツールです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webfont-link" rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Kosugi+Maru&family=Dela+Gothic+One&family=RocknRoll+One&family=Yusei+Magic&family=Kaisei+Decol:wght@400;700&family=Stick&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="appbar">
  <h1 class="appbar__title">商品ポップメーカー</h1>
  <div class="appbar__actions">
    <label class="field field--inline field--compact">
      <span class="field__label">解像度</span>
      <select id="export-dpi" class="control">
        <option value="150">150dpi（軽い）</option>
        <option value="300" selected>300dpi（印刷推奨）</option>
        <option value="600">600dpi（高精細）</option>
      </select>
    </label>
    <button type="button" id="btn-png" class="btn btn--primary">PNG保存</button>
    <button type="button" id="btn-print" class="btn">印刷</button>
    <button type="button" id="btn-save-json" class="btn btn--ghost">データ保存</button>
    <button type="button" id="btn-load-json" class="btn btn--ghost">データ読込</button>
    <button type="button" id="btn-reset" class="btn btn--ghost">リセット</button>
    <input type="file" id="file-json" accept="application/json,.json" hidden>
  </div>
</header>

<main class="layout">

  <!-- ============ 操作パネル ============ -->
  <section class="panel" aria-label="設定パネル">

    <!-- 内容 -->
    <details class="sect" open>
      <summary class="sect__head">1. 内容を入力</summary>
      <div class="sect__body">

        <label class="field">
          <span class="field__label">キャッチコピー<span class="field__hint">（任意）</span></span>
          <input type="text" class="control" data-path="catch.text" placeholder="例）大人気！本日限り">
        </label>

        <label class="field">
          <span class="field__label field__label--req">商品名</span>
          <textarea class="control" rows="2" data-path="name.text" aria-required="true" placeholder="例）北海道産 生クリーム大福"></textarea>
        </label>

        <div class="grid grid--2">
          <label class="field">
            <span class="field__label field__label--req">価格</span>
            <input type="text" inputmode="decimal" class="control" data-path="price.value" aria-required="true" placeholder="例）980">
          </label>
          <label class="field">
            <span class="field__label">税表記</span>
            <select class="control" data-path="price.taxNote">
              <option value="">表示しない</option>
              <option value="税込">税込</option>
              <option value="税抜">税抜</option>
              <option value="本体価格">本体価格</option>
              <option value="税込価格">税込価格</option>
            </select>
          </label>
        </div>

        <div class="grid grid--3">
          <label class="field">
            <span class="field__label">通貨記号</span>
            <select class="control" data-path="price.prefix">
              <option value="">なし</option>
              <option value="¥">¥</option>
              <option value="＠">＠</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">単位</span>
            <select class="control" data-path="price.suffix">
              <option value="円">円</option>
              <option value="円〜">円〜</option>
              <option value="">なし</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">補足<span class="field__hint">（任意）</span></span>
            <input type="text" class="control" data-path="price.unit" placeholder="例）/ 100g">
          </label>
        </div>

        <div class="field">
          <label class="check">
            <input type="checkbox" data-path="price.strike.enabled">
            <span>参考価格を打ち消し線で表示する</span>
          </label>
          <input type="text" inputmode="decimal" class="control" data-path="price.strike.value" placeholder="例）1,280（通常価格）">
        </div>

        <label class="field">
          <span class="field__label">商品の説明文</span>
          <textarea class="control" rows="4" data-path="desc.text" placeholder="例）北海道産の生クリームを使用したなめらかな口どけ。冷やしてお召し上がりください。"></textarea>
        </label>

        <label class="field">
          <span class="field__label">注記・店名<span class="field__hint">（任意）</span></span>
          <input type="text" class="control" data-path="note.text" placeholder="例）※数量限定・なくなり次第終了　◯◯ストア">
        </label>
      </div>
    </details>

    <!-- 文字 -->
    <details class="sect" open>
      <summary class="sect__head">2. 文字の大きさ・フォント</summary>
      <div class="sect__body">

        <div class="tabs" role="tablist" id="text-tabs" aria-label="文字設定の項目">
          <button type="button" class="tab is-active" role="tab" id="tab-name" aria-controls="panel-name" aria-selected="true" data-tab="name">商品名</button>
          <button type="button" class="tab" role="tab" id="tab-catch" aria-controls="panel-catch" aria-selected="false" tabindex="-1" data-tab="catch">キャッチ</button>
          <button type="button" class="tab" role="tab" id="tab-price" aria-controls="panel-price" aria-selected="false" tabindex="-1" data-tab="price">価格</button>
          <button type="button" class="tab" role="tab" id="tab-desc" aria-controls="panel-desc" aria-selected="false" tabindex="-1" data-tab="desc">説明文</button>
          <button type="button" class="tab" role="tab" id="tab-note" aria-controls="panel-note" aria-selected="false" tabindex="-1" data-tab="note">注記</button>
        </div>

        <div class="tabpanels" id="text-panels"><!-- JSで生成 --></div>

        <div class="field">
          <span class="field__label">全体の文字サイズ</span>
          <div class="btnrow">
            <button type="button" class="btn btn--sm" data-scale-all="0.9">すべて小さく −</button>
            <button type="button" class="btn btn--sm" data-scale-all="1.1">すべて大きく ＋</button>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" data-path="layout.autoFit">
          <span>用紙からはみ出すときは自動で縮小する</span>
        </label>
      </div>
    </details>

    <!-- レイアウト -->
    <details class="sect">
      <summary class="sect__head">3. 用紙とレイアウト</summary>
      <div class="sect__body">
        <div class="grid grid--2">
          <label class="field">
            <span class="field__label">用紙サイズ</span>
            <select class="control" data-path="paper.id" id="paper-select"></select>
          </label>
          <label class="field">
            <span class="field__label">向き</span>
            <select class="control" data-path="paper.orientation">
              <option value="portrait">縦</option>
              <option value="landscape">横</option>
            </select>
          </label>
        </div>

        <div class="grid grid--2" id="custom-size" hidden>
          <label class="field">
            <span class="field__label">幅（mm）</span>
            <input type="number" min="20" max="1000" step="1" class="control" data-path="paper.customW">
          </label>
          <label class="field">
            <span class="field__label">高さ（mm）</span>
            <input type="number" min="20" max="1000" step="1" class="control" data-path="paper.customH">
          </label>
        </div>

        <div class="grid grid--2">
          <label class="field">
            <span class="field__label">文字揃え</span>
            <select class="control" data-path="layout.align">
              <option value="center">中央揃え</option>
              <option value="left">左揃え</option>
              <option value="right">右揃え</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">縦の配置</span>
            <select class="control" data-path="layout.valign">
              <option value="center">中央</option>
              <option value="top">上寄せ</option>
              <option value="space">上下いっぱいに広げる</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span class="field__label">余白 <output class="field__out" data-out="layout.padding"></output> mm</span>
          <input type="range" min="0" max="40" step="1" class="control control--range" data-path="layout.padding">
        </label>

        <label class="field">
          <span class="field__label">要素の間隔 <output class="field__out" data-out="layout.gap"></output> mm</span>
          <input type="range" min="0" max="30" step="1" class="control control--range" data-path="layout.gap">
        </label>

        <label class="check">
          <input type="checkbox" data-path="layout.divider">
          <span>商品名と価格の間に区切り線を入れる</span>
        </label>
      </div>
    </details>

    <!-- デザイン -->
    <details class="sect">
      <summary class="sect__head">4. デザイン・色</summary>
      <div class="sect__body">
        <div class="field">
          <span class="field__label">テンプレート</span>
          <div class="templates" id="template-list"></div>
          <p class="field__hint">※テンプレートを選ぶと色・フォント・枠線がまとめて変わります（文章はそのまま）</p>
        </div>

        <div class="grid grid--2">
          <label class="field">
            <span class="field__label">背景色</span>
            <input type="color" class="control control--color" data-path="design.bg">
          </label>
          <label class="field">
            <span class="field__label">アクセント色</span>
            <input type="color" class="control control--color" data-path="design.accent">
          </label>
        </div>

        <div class="grid grid--3">
          <label class="field">
            <span class="field__label">枠線</span>
            <select class="control" data-path="design.border.style">
              <option value="none">なし</option>
              <option value="solid">実線</option>
              <option value="double">二重線</option>
              <option value="dashed">破線</option>
              <option value="round">角丸</option>
            </select>
          </label>
          <label class="field">
            <span class="field__label">太さ <output class="field__out" data-out="design.border.width"></output> mm</span>
            <input type="range" min="0.2" max="8" step="0.2" class="control control--range" data-path="design.border.width">
          </label>
          <label class="field">
            <span class="field__label">枠線の色</span>
            <input type="color" class="control control--color" data-path="design.border.color">
          </label>
        </div>

        <label class="field">
          <span class="field__label">ヘッダー帯</span>
          <select class="control" data-path="design.band">
            <option value="none">なし</option>
            <option value="top">上に帯を入れる</option>
            <option value="behindName">商品名の背景を塗る</option>
          </select>
        </label>

        <hr class="sep">

        <label class="check">
          <input type="checkbox" data-path="badge.enabled">
          <span>バッジを表示する</span>
        </label>
        <div class="grid grid--2">
          <label class="field">
            <span class="field__label">バッジの文字</span>
            <input type="text" class="control" data-path="badge.text" placeholder="例）NEW / おすすめ / 半額">
          </label>
          <label class="field">
            <span class="field__label">スタイル</span>
            <select class="control" data-path="badge.style">
              <option value="chip">角丸タグ（上部）</option>
              <option value="ribbon">リボン（右上・斜め）</option>
              <option value="circle">丸印（右上）</option>
            </select>
          </label>
        </div>
        <div class="grid grid--3">
          <label class="field">
            <span class="field__label">背景</span>
            <input type="color" class="control control--color" data-path="badge.bg">
          </label>
          <label class="field">
            <span class="field__label">文字色</span>
            <input type="color" class="control control--color" data-path="badge.color">
          </label>
          <label class="field">
            <span class="field__label">大きさ <output class="field__out" data-out="badge.size"></output> pt</span>
            <input type="range" min="8" max="80" step="1" class="control control--range" data-path="badge.size">
          </label>
        </div>
      </div>
    </details>

    <!-- 画像 -->
    <details class="sect">
      <summary class="sect__head">5. 画像（写真・ロゴ）</summary>
      <div class="sect__body">
        <div class="btnrow">
          <button type="button" class="btn btn--primary" id="btn-image-add">画像を追加 / 差し替え</button>
          <button type="button" class="btn btn--ghost" id="btn-image-del">削除</button>
        </div>
        <input type="file" id="file-image" accept="image/*" hidden>

        <div id="image-controls" hidden>
          <p class="field__hint">プレビュー上でドラッグ＝移動、四隅をドラッグ＝拡大縮小。位置X/Y・幅の数値でも調整できます。</p>
          <label class="field">
            <span class="field__label">幅 <output class="field__out" data-out="image.wMm"></output> mm</span>
            <input type="range" min="10" max="600" step="1" class="control control--range" data-path="image.wMm">
          </label>
          <div class="grid grid--2">
            <label class="field">
              <span class="field__label">位置X（mm）</span>
              <input type="number" min="-600" max="600" step="1" class="control" data-path="image.xMm">
            </label>
            <label class="field">
              <span class="field__label">位置Y（mm）</span>
              <input type="number" min="-600" max="600" step="1" class="control" data-path="image.yMm">
            </label>
          </div>
          <div class="grid grid--2">
            <label class="field">
              <span class="field__label">重ね順</span>
              <select class="control" data-path="image.layer">
                <option value="back">文字の後ろ（背景）</option>
                <option value="front">文字の前（前面）</option>
              </select>
            </label>
            <label class="field">
              <span class="field__label">透明度 <output class="field__out" data-out="image.opacity"></output></span>
              <input type="range" min="0.1" max="1" step="0.05" class="control control--range" data-path="image.opacity">
            </label>
          </div>
        </div>
      </div>
    </details>

    <!-- 保存 -->
    <details class="sect">
      <summary class="sect__head">6. デザインの保存</summary>
      <div class="sect__body">
        <div class="field">
          <span class="field__label">名前を付けて保存</span>
          <div class="btnrow">
            <input type="text" class="control" id="preset-name" placeholder="例）お菓子コーナー用">
            <button type="button" class="btn" id="btn-preset-save">保存</button>
          </div>
        </div>
        <div class="field">
          <span class="field__label">保存済み</span>
          <ul class="presets" id="preset-list"></ul>
        </div>
        <p class="field__hint">保存先はこのブラウザ内（localStorage）です。編集内容は自動保存され、次回開いたときに復元されます。</p>
      </div>
    </details>
  </section>

  <!-- ============ プレビュー ============ -->
  <section class="preview" aria-label="プレビュー">
    <div class="preview__bar">
      <span class="preview__meta" id="preview-meta"></span>
      <span class="preview__status" id="status" role="status" aria-live="polite"></span>
    </div>
    <div class="preview__stage" id="preview-stage">
      <canvas id="canvas" class="preview__canvas" role="img" aria-label="商品ポップのプレビュー"></canvas>
    </div>
    <p class="preview__note">プレビューは実際の印刷仕上がりと同じレイアウトです。</p>
  </section>
</main>

<script src="assets/js/fonts.js"></script>
<script src="assets/js/text.js"></script>
<script src="assets/js/presets.js"></script>
<script src="assets/js/imposition.js"></script>
<script src="assets/js/renderer.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
